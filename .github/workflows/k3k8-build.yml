---
# Fork-specific workflow for k3k8/headscale.
# Builds and pushes a Docker image to ghcr.io/k3k8/headscale on version tags.
#
# Trigger: push a tag like "v0.29.3-k3k8.1" to kick off a build.
# The image is tagged with both the git tag and the short commit SHA.
#
# Upstream-only workflows are removed in the same commit so that merging
# upstream does not re-introduce failed or noisy runs. Kept from upstream:
# build.yml, check-generated.yml, nix-checks.yml (gotest + lint + fmt)
# and servertest.yml.
name: k3k8 Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  container:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main
      - uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527 # v2.0.0

      - name: Set commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Build and push
        env:
          KO_DOCKER_REPO: ghcr.io/k3k8/headscale
          KO_DEFAULTBASEIMAGE: gcr.io/distroless/base-debian13
          CGO_ENABLED: "0"
        run: |
          ko build \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags=${GITHUB_REF_NAME},sha-${GITHUB_SHA::7} \
            ./cmd/headscale
